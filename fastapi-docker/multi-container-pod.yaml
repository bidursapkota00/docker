apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: app
      image: fastapi-app1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8000
    - name: sidecar
      image: busybox
      command:
        ["sh", "-c", "while true; do echo 'Health Check!'; sleep 30; done"]
